name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.example.myapp MyApp
          cd myapp
          cordova platform add android
          rm -rf www/*
          cp ../index.html www/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          log-accepted-licenses: false

      - name: Force Accept Android Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n2446ee9b8d73a5d74b43e72e1a6406f4099d996e\n504667f4c0de7ff6a46347b3e344000d683eff33\nd56699a7a7491d73f29350a6256828a1c8750228\n84831b9409646a54c50e294b2737a346eb424c14\nf99176a99776a345d3e5506c7755d11f19d72d1d\n718d27abf26d8434354a5f4b79d2db181db0c5a6" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-preview-license
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: |
          cd myapp
          cordova build android --no-telemetry

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
