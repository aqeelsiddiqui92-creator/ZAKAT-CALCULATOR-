<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zakat Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#061b3a,#0b4f6c);color:#fff;padding:24px 14px}.container{max-width:720px;margin:auto}.card{background:rgba(255,255,255,.10);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:24px;box-shadow:0 15px 40px rgba(0,0,0,.25)}.lang-buttons{display:flex;gap:10px;justify-content:center;margin-bottom:22px}.lang-btn{flex:1;padding:10px;border:2px solid #ffd54a;border-radius:10px;background:transparent;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:0!important}.lang-btn.active-lang{background:#ffd54a;color:#111}h1{text-align:center;margin:0 0 6px;font-size:30px}.subtitle{text-align:center;margin:0 0 22px;opacity:.85}label{display:block;margin:14px 0 7px;font-weight:700}input{width:100%;padding:13px 14px;border:0;border-radius:10px;font-size:16px;outline:none}button[type=submit]{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#ffd54a;color:#111;font-size:18px;font-weight:700;cursor:pointer}.result{margin-top:20px;padding:18px;border-radius:12px;background:rgba(0,0,0,.22);line-height:1.8}.zakat{font-size:25px;font-weight:800;margin-top:8px}.error{color:#ffd0d0;font-weight:700}.footer{text-align:center;margin-top:18px;font-weight:700;opacity:.9}.lang-content{display:none}.lang-content.active{display:block}
</style>
</head>
<body><div class="container"><div class="card">
<div class="lang-buttons"><button type="button" id="btn-en" class="lang-btn active-lang" onclick="switchLanguage('en')">English</button><button type="button" id="btn-ur" class="lang-btn" onclick="switchLanguage('ur')">اردو</button><button type="button" id="btn-hi" class="lang-btn" onclick="switchLanguage('hi')">हिन्दी</button></div>

<div id="content-en" class="lang-content active"><h1>🕋Zakat Calculator</h1><p class="subtitle">Calculate your zakat</p><form class="zakatForm" data-lang="en">
<label>Weight of silver in grams</label><input type="number" class="sw" min="0" step="any" placeholder="Enter silver weight">
<label>Weight of gold in grams</label><input type="number" class="gw" min="0" step="any" placeholder="Enter gold weight">
<label>Price of 1 kg silver (₹)</label><input type="number" class="sp" min="0" step="any" placeholder="Enter silver price">
<label>Price of 10 gram gold (₹)</label><input type="number" class="gp" min="0" step="any" placeholder="Enter gold price">
<label>Total amount including savings (GPF, PPF, FD, cash, loan given, etc.) (₹)</label><input type="number" class="c" min="0" step="any" placeholder="Enter total amount">
<button type="submit">CALCULATE ZAKAT</button></form></div>

<div id="content-ur" class="lang-content" style="direction:rtl;text-align:right"><h1>🕋زکوٰۃ کیلکولیٹر</h1><p class="subtitle">تاج الشریعہ 👑</p><form class="zakatForm" data-lang="ur">
<label>چاندی کا وزن گرام میں</label><input type="number" class="sw" min="0" step="any" placeholder="چاندی کا وزن درج کریں">
<label>سونے کا وزن گرام میں</label><input type="number" class="gw" min="0" step="any" placeholder="سونے کا وزن درج کریں">
<label>1 کلوگرام چاندی کی قیمت (₹)</label><input type="number" class="sp" min="0" step="any" placeholder="چاندی کی قیمت درج کریں">
<label>10 گرام سونے کی قیمت (₹)</label><input type="number" class="gp" min="0" step="any" placeholder="سونے کی قیمت درج کریں">
<label>کل رقم بشمول بچت (GPF، PPF، FD، کیش، قرض دی گئی رقم وغیرہ) (₹)</label><input type="number" class="c" min="0" step="any" placeholder="کل رقم درج کریں">
<button type="submit">زکوٰۃ کا حساب لگائیں</button></form></div>

<div id="content-hi" class="lang-content"><h1>🕋 ज़कात कैलकुलेटर</h1><p class="subtitle">ज़कात निकालिए</p><form class="zakatForm" data-lang="hi">
<label>ग्राम में चांदी का वजन</label><input type="number" class="sw" min="0" step="any" placeholder="चांदी का वजन दर्ज करें">
<label>ग्राम में सोने का वजन</label><input type="number" class="gw" min="0" step="any" placeholder="सोने का वजन दर्ज करें">
<label>1 किलो चांदी की कीमत (₹)</label><input type="number" class="sp" min="0" step="any" placeholder="चांदी की कीमत दर्ज करें">
<label>10 ग्राम सोने की कीमत (₹)</label><input type="number" class="gp" min="0" step="any" placeholder="सोने की कीमत दर्ज करें">
<label>बचत सहित कुल राशि (GPF, PPF, FD, नकद, दिया गया ऋण, आदि) (₹)</label><input type="number" class="c" min="0" step="any" placeholder="कुल राशि दर्ज करें">
<button type="submit">ज़कात की गणना करें</button></form></div>

<div id="result" class="result" style="display:none"></div><div class="footer">*** GHULAM E TAJUSHSHARIYAH ***</div>
</div></div>
<script>
function switchLanguage(lang){document.querySelectorAll(".lang-content").forEach(el=>el.classList.remove("active"));document.querySelectorAll(".lang-btn").forEach(btn=>btn.classList.remove("active-lang"));document.getElementById("content-"+lang).classList.add("active");document.getElementById("btn-"+lang).classList.add("active-lang");document.getElementById("result").style.display="none"}
document.querySelectorAll(".zakatForm").forEach(form=>{form.addEventListener("submit",function(e){e.preventDefault();const lang=this.dataset.lang,sq=Number(this.querySelector(".sw").value)||0,gq=Number(this.querySelector(".gw").value)||0,sp=Number(this.querySelector(".sp").value)||0,gp=Number(this.querySelector(".gp").value)||0,c=Number(this.querySelector(".c").value)||0,result=document.getElementById("result"),x=gq*gp/10+sq*sp/1000+c;
if((sq>0||c>0)&&sp===0){result.style.display="block";result.innerHTML=lang==="ur"?'<div class="error">براہ کرم چاندی کی قیمت درج کریں۔</div>':lang==="hi"?'<div class="error">कृपया चांदी की कीमत दर्ज करें।</div>':'<div class="error">Please enter silver price.</div>';return}
if(gq!==0&&gp===0){result.style.display="block";result.innerHTML=lang==="ur"?'<div class="error">براہ کرم سونے کی قیمت درج کریں۔</div>':lang==="hi"?'<div class="error">कृपया सोने की कीमत दर्ज کریں۔</div>':'<div class="error">Please enter gold price.</div>';return}
let html="";
if(sq!==0||c!==0){const nisab=.653184*sp;if(x<nisab){html=lang==="ur"?"آپ صاحبِ نصاب نہیں ہیں۔<br>نصاب کی رقم = ₹"+nisab.toFixed(2)+"<br>آپ کی کل رقم = ₹"+x.toFixed(2)+'<br><div class="zakat">آپ کی کل زکوٰۃ = ₹0.00</div>':lang==="hi"?"आप साहिबे निसाब नहीं हैं।<br>निशाब राशि = ₹"+nisab.toFixed(2)+"<br>आपकी कुल राशि = ₹"+x.toFixed(2)+'<br><div class="zakat">आपकी कुल जकात = ₹0.00</div>':"You are not malike nisab.<br>NISAB AMOUNT = ₹"+nisab.toFixed(2)+"<br>YOUR TOTAL AMOUNT = ₹"+x.toFixed(2)+'<br><div class="zakat">YOUR TOTAL ZAKAT = ₹0.00</div>'}else{const y=x/40;html=lang==="ur"?"چاندی کی قیمت = ₹"+(sp*sq/1000).toFixed(2)+"<br>سونے کی قیمت = ₹"+(gq*gp/10).toFixed(2)+"<br>کل رقم (کیش، ڈیپازیٹ، دیا گیا قرض) = ₹"+c.toFixed(2)+"<br>کل رقم = ₹"+x.toFixed(2)+'<br><div class="zakat">آپ کی کل زکوٰۃ = ₹'+y.toFixed(2)+"</div>":lang==="hi"?"चांदी की कीमत = ₹"+(sp*sq/1000).toFixed(2)+"<br>सोने की कीमत = ₹"+(gq*gp/10).toFixed(2)+"<br>कुल राशि (नकद, जमा, दिया गया ऋण) = ₹"+c.toFixed(2)+"<br>कुल राशि = ₹"+x.toFixed(2)+'<br><div class="zakat">आपकी कुल जकात = ₹'+y.toFixed(2)+"</div>":"PRICE OF SILVER = ₹"+(sp*sq/1000).toFixed(2)+"<br>PRICE OF GOLD = ₹"+(gq*gp/10).toFixed(2)+"<br>TOTAL RS (CASH, DEPOSIT, LOAN GIVEN) = ₹"+c.toFixed(2)+"<br>TOTAL AMOUNT = ₹"+x.toFixed(2)+'<br><div class="zakat">YOUR TOTAL ZAKAT = ₹'+y.toFixed(2)+"</div>"}}
if(sq===0&&c===0){const goldNisab=9.3312*gp;if(x<goldNisab)html=lang==="ur"?"آپ صاحبِ نصاب نہیں ہیں۔<br>زکوٰۃ کے لیے کم از کم 93.312 گرام سونا ضروری ہے۔<br>":lang==="hi"?"आप साहिबे निसाब नहीं हैं।<br>जकात के लिए कम से कम 93.312 ग्राम सोना आवश्यक है।<br>":"You are not malike nisab.<br>Minimum 93.312 gm gold is required for zakat.<br>";else{const y=x/40;html=lang==="ur"?'<div class="zakat">آپ کی کل زکوٰۃ = ₹'+y.toFixed(2)+"</div>":lang==="hi"?'<div class="zakat">आपकी कुल जकात = ₹'+y.toFixed(2)+"</div>":'<div class="zakat">YOUR TOTAL ZAKAT = ₹'+y.toFixed(2)+"</div>"}}
result.style.display="block";result.innerHTML=html||(lang==="ur"?"براہ کرم اپنی قیمتیں درج کریں۔":lang==="hi"?"कृपया अपने मान (values) दर्ज करें।":"Please enter your values.");})});
</script></body></html>
